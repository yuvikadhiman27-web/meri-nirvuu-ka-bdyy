<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nirvi! 🎀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif; background:#5a0f1a; overflow:hidden; height:100vh}
.slide{position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; padding:15px; background:#5a0f1a}
.slide.active{display:flex; animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.full-img{width:95vw; max-width:420px; max-height:82vh; object-fit:contain; border-radius:15px; box-shadow:0 15px 40px rgba(0,0,0,0.5)}
.btn{background:#f9e4c0; color:#8b1a2e; border:none; padding:13px 30px; border-radius:30px; margin-top:18px; font-weight:bold; cursor:pointer; letter-spacing:1px; font-size:15px; box-shadow:0 5px 15px rgba(0,0,0,0.2)}
.env-scene{position:relative; width:92vw; max-width:420px; height:55vh; display:flex; align-items:center; justify-content:center}
.env-img{width:100%; max-width:380px; z-index:2; position:relative; transition:0.6s; border-radius:12px; cursor:pointer; filter:drop-shadow(0 15px 30px rgba(0,0,0,0.4))}
.letter-pop{position:absolute; width:85%; max-width:340px; top:18%; left:50%; transform:translate(-50%,0) rotate(4deg); z-index:1; border-radius:10px; box-shadow:0 8px 25px rgba(0,0,0,0.4); transition:0.8s cubic-bezier(0.34,1.56,0.64,1); cursor:pointer; border:3px solid #fff}
.env-scene.open .env-img{transform:translateY(90px) scale(0.88)}
.env-scene.open .letter-pop{transform:translate(-50%,-22%) rotate(0deg) scale(1.08); z-index:5; top:0}
.hint{color:#f9e4c0; margin-top:20px; font-size:0.95em; letter-spacing:0.5px}
.dots{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:100}
.dot{width:8px; height:8px; border-radius:50%; background:rgba(249,228,192,0.3)}
.dot.active{background:#f9e4c0; width:22px; border-radius:10px}
</style>
</head>
<body>

<div class="slide active" id="s1">
<img src="slide1.jpg" class="full-img">
<button class="btn" onclick="go(2)">open your letter → 💌</button>
</div>

<div class="slide" id="s2">
<p style="color:#f9e4c0; margin-bottom:12px; font-weight:bold; letter-spacing:2px">YOU HAVE A LETTER...</p>
<div class="env-scene" id="env" onclick="openIt()">
<img src="slide2.jpg" class="letter-pop" id="letter">
<img src="envelope.png" class="env-img">
</div>
<p class="hint" id="hint">tap the lily envelope to POP it 💖</p>
<button class="btn" id="b2" style="display:none" onclick="go(3)">read full letter →</button>
</div>

<div class="slide" id="s3">
<img src="slide2.jpg" class="full-img">
<button class="btn" onclick="go(4)">one more letter →</button>
</div>

<div class="slide" id="s4">
<img src="slide3.jpg" class="full-img">
<button class="btn" onclick="go(5)">last surprise → 🎂</button>
</div>

<div class="slide" id="s5">
<img src="slide4.jpg" class="full-img">
<div id="candles" style="margin-top:20px; display:flex; gap:15px; font-size:42px; cursor:pointer" onclick="blow()"><span>🕯️</span><span>🕯️</span><span>🕯️</span></div>
<p style="color:#f9e4c0; margin-top:15px" id="st">tap candles to blow 💨</p>
<h2 id="done" style="display:none; color:#f9e4c0; margin-top:12px; text-align:center">YAYY NIRVI! MAKE A WISH! ✨💖</h2>
</div>

<div class="dots">
<div class="dot active" onclick="go(1)"></div>
<div class="dot" onclick="go(2)"></div>
<div class="dot" onclick="go(3)"></div>
<div class="dot" onclick="go(4)"></div>
<div class="dot" onclick="go(5)"></div>
</div>

<script>
function go(n){document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));document.getElementById('s'+n).classList.add('active');document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i==n-1))}
function openIt(){document.getElementById('env').classList.add('open');document.getElementById('hint').innerText='OMG IT POPPED OUT!! 😭💖';document.getElementById('b2').style.display='block';for(let i=0;i<25;i++){let e=document.createElement('div');e.innerHTML='🌸';e.style.position='fixed';e.style.left=Math.random()*100+'vw';e.style.top='-10px';e.style.fontSize='20px';e.style.animation=`fall ${2+Math.random()*2}s linear`;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function blow(){document.getElementById('candles').style.opacity='0';document.getElementById('candles').style.transform='translateY(-50px)';document.getElementById('done').style.display='block';document.getElementById('st').innerText='Happy Birthday meri kuchupuchu!! 🎉💖'}
let st=document.createElement('style');st.innerHTML='@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}';document.head.appendChild(st);
</script>
</body>
</html>
